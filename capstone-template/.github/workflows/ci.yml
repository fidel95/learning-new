# Continuous integration: every push and pull request runs the tests on a clean machine.
# Copy this folder's .github/ to the ROOT of your own repo (GitHub only reads workflows from the root).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
